<style>*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#101828;font-family:Inter,system-ui,sans-serif;line-height:1.55}.wrap{width:min(900px,calc(100% - 32px));margin:auto}header{background:#fff;border-bottom:1px solid #e5e7eb}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:900;letter-spacing:-.05em}.brand span{font-weight:500;color:#667085}.back{font-size:14px;color:#475467}.hero{padding:52px 0 30px}.kicker{font-size:12px;font-weight:800;letter-spacing:.12em;color:#667085}.hero h1{font-size:clamp(38px,7vw,64px);line-height:1;letter-spacing:-.06em;margin:12px 0 18px}.lead{font-size:19px;color:#475467;max-width:720px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:26px;margin-bottom:16px}.card h2{margin:0 0 10px}.muted{color:#667085}.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;color:#667085}.meta strong{color:#101828}.rating{font-weight:800}.review-text{font-size:17px;white-space:pre-wrap}.provenance{border-top:1px solid #eaecf0;padding-top:14px;margin-top:18px;font-size:13px;color:#667085}.empty{text-align:center;padding:42px 26px}.source{display:inline-block;margin-top:10px;color:#475467;font-size:13px}.status{font-size:14px;color:#475467}.error{color:#b42318}.skeleton{height:150px;background:linear-gradient(90deg,#f2f4f7,#fff,#f2f4f7);border-radius:16px}a{color:inherit}@media(max-width:650px){.hero{padding-top:38px}}</style>

</head>
<body><header><div class="wrap nav"><a class="brand" href="https://отзыв.com/">отзыв<span>.com</span></a><a class="back" href="https://отзыв.com/">На главную →</a></div></header>
<main><section class="hero"><div class="wrap"><div class="kicker">ПУБЛИЧНЫЕ ОТЗЫВЫ</div><h1 id="title">Отзывы компаний</h1><p class="lead">Здесь публикуются только реальные отзывы, прошедшие предусмотренную проверку и модерацию. Внешние рейтинги не смешиваются с отзывами Отзыв.com.</p><p class="status" id="status">Загрузка данных…</p></div></section><section><div class="wrap" id="content"><div class="card skeleton" aria-hidden="true"></div></div></section></main>
<script>
const SUPABASE_URL='https://rzhlcszqtuhkhfibygnk.supabase.co';const SUPABASE_KEY='sb_publishable_yhqWJ1eWUznBkqKwPogTrw_xCdCbFA-';const params=new URLSearchParams(location.search);const slug=params.get('company')||'ortomediya';
const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const date=v=>v?new Intl.DateTimeFormat('ru-RU',{dateStyle:'long'}).format(new Date(v)):'Дата не указана';const stars=n=>{const x=Math.max(0,Math.min(5,Number(n)||0));return '★'.repeat(Math.round(x))+'☆'.repeat(5-Math.round(x));};
async function load(){const status=document.getElementById('status');try{const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/get_public_company_profile_v2',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_slug:slug})});if(!r.ok)throw new Error('RPC '+r.status);const p=await r.json();if(!p||!p.id)throw new Error('Профиль не найден');document.title='Отзывы — '+p.name+' | Отзыв.com';document.getElementById('title').textContent='Отзывы — '+p.name;const reviews=Array.isArray(p.reviews)?p.reviews:[];status.textContent=reviews.length?'Опубликовано отзывов: '+reviews.length:'Сейчас опубликованных отзывов нет.';const content=document.getElementById('content');if(!reviews.length){content.innerHTML='<article class="card empty"><h2>Пока нет опубликованных отзывов</h2><p class="muted">Здесь появится полный текст реального отзыва только после подачи, проверки, модерации и публикации.</p><p class="source">Рейтинг внешнего источника хранится отдельно и не является отзывом Отзыв.com.</p></article>';return;}content.innerHTML=reviews.map(x=>`<article class="card" id="review-${esc(x.id)}" data-review-id="${esc(x.id)}"><div class="meta"><strong>${esc(x.author||'Автор')}</strong><span class="rating" aria-label="${esc(x.rating)} из ${esc(x.rating_scale||5)}">${stars(x.rating)} ${esc(x.rating)}/${esc(x.rating_scale||5)}</span><time datetime="${esc(x.published_at||'')}">${date(x.published_at)}</time></div><h2>Отзыв</h2><p class="review-text">${esc(x.body||x.excerpt||'')}</p><div class="provenance"><b>Происхождение:</b> ${esc(x.provenance||'Отзыв.com')} · ID: <code>${esc(x.id)}</code>${x.source_url?' · <a href="'+esc(x.source_url)+'" rel="nofollow noopener">Источник</a>':''}</div></article>`).join('');const json=document.getElementById('reviews-jsonld');json.textContent=JSON.stringify({'@context':'https://schema.org','@type':'ItemList','name':'Отзывы — '+p.name,'itemListElement':reviews.map((x,i)=>({'@type':'ListItem','position':i+1,'item':{'@type':'Review','@id':location.origin+location.pathname+'?company='+encodeURIComponent(p.slug)+'#review-'+x.id,'author':{'@type':'Person','name':x.author||'Автор'},'datePublished':x.published_at,'reviewBody':x.body||x.excerpt||'','reviewRating':{'@type':'Rating','ratingValue':x.rating,'bestRating':x.rating_scale||5}}}))});}catch(e){status.className='status error';status.textContent='Не удалось загрузить отзывы. Попробуйте позже.';document.getElementById('content').innerHTML='<article class="card"><h2>Данные временно недоступны</h2><p class="muted">Публичный профиль не изменён. Повторите запрос позже.</p></article>';console.error(e);}}load();
</script></body></html>
