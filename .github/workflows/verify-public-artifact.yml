name: Verify public artifact
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public files
        run: |
          test -s index.html
          test -s robots.txt
          test -s sitemap.xml
          test -s reviews/moderation.html
          test -s reviews/moderation.css
